<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | CineBook Cinemas</title>
    <link rel="stylesheet" href="css/styles.css?v=2.5">
</head>
<body class="auth-page-body">
    <!-- Shared Cinematic Ambient Background -->
    <div class="cinematic-ambient-bg" aria-hidden="true">
        <div class="ambient-aurora-layer"></div>
        <div class="ambient-light-rays"></div>
        <div class="ambient-orb orb-primary"></div>
        <div class="ambient-orb orb-secondary"></div>
        <div class="ambient-orb orb-accent"></div>
        <canvas id="ambientParticlesCanvas" class="ambient-particles-canvas"></canvas>
    </div>

    <!-- Centered Glass Login Card with Ambient Halo Ring -->
    <main class="auth-center-wrapper">
        <div class="auth-card-halo" aria-hidden="true"></div>
        <div class="auth-glass-card">
            <!-- Brand Mark -->
            <div class="auth-brand-dock">
                <div class="nav-symbol-prism" style="width:52px; height:52px; background:linear-gradient(135deg, rgba(167, 139, 250, 0.4), rgba(197, 164, 109, 0.35)); border:1.5px solid rgba(255, 255, 255, 0.3); box-shadow:0 0 20px rgba(167, 139, 250, 0.35);">
                    <span class="symbol-core" style="font-size:1.35rem; font-weight:800; color:#FFFFFF;">CB</span>
                </div>
                <h1 class="brand-title" style="font-size:2rem; margin-top:0.75rem; letter-spacing:1px; color:#FFFFFF;">CINE<span style="color:#C5A46D;">BOOK</span></h1>
                <p class="brand-sub" style="font-size:0.78rem; letter-spacing:2.5px; color:#C5A46D; font-weight:700; margin-top:0.25rem;">PREMIUM CINEMA PORTAL</p>
            </div>

            <div class="auth-header-text">
                <h2>Welcome Back</h2>
                <p>Sign in to access screenings, reserved seating, and active digital tickets.</p>
            </div>

            <!-- Login Form (POSTs to /api/auth/login) -->
            <form id="loginForm" class="auth-form-group">
                <div class="glass-field-group">
                    <label for="username">Username or Mobile Number</label>
                    <input type="text" id="username" name="username" required placeholder="e.g. 9876543210 or admin" autocomplete="username" autofocus>
                </div>

                <div class="glass-field-group" style="margin-top:1.1rem;">
                    <label for="password">Password</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="password" name="password" required placeholder="••••••••" autocomplete="current-password">
                        <button type="button" class="btn-toggle-password" id="togglePasswordBtn" aria-label="Toggle password visibility" title="Show/Hide Password">
                            <span id="togglePasswordIcon">👁️</span>
                        </button>
                    </div>
                </div>

                <button type="submit" id="btnLoginSubmit" class="btn-auth-submit">
                    <span>🔐</span> Sign In
                </button>
            </form>

            <div class="auth-switch-dock">
                <span>New to CineBook?</span>
                <a href="register.html" class="auth-link-highlight">Create a customer account &rarr;</a>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="js/app.js?v=2.5"></script>
    <script src="js/app.js?v=2.6"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('loginForm');
            const submitBtn = document.getElementById('btnLoginSubmit');
            const passwordInput = document.getElementById('password');
            const toggleBtn = document.getElementById('togglePasswordBtn');
            const toggleIcon = document.getElementById('togglePasswordIcon');

            // Password visibility toggle
            if (toggleBtn && passwordInput) {
                toggleBtn.addEventListener('click', () => {
                    const isPassword = passwordInput.type === 'password';
                    passwordInput.type = isPassword ? 'text' : 'password';
                    toggleIcon.textContent = isPassword ? '🙈' : '👁️';
                    toggleBtn.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
                });
            }

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<span>⏳</span> Verifying credentials...';

                const username = document.getElementById('username').value.trim();
                const password = passwordInput.value;

                const params = new URLSearchParams();
                params.append('username', username);
                params.append('password', password);

                try {
                    const resp = await fetch('/api/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: params.toString()
                    });

                    const data = await resp.json();
                    if (resp.ok && data.success) {
                        showToast('Sign in successful! Entering CineBook...', 'success');
                        setTimeout(() => {
                            window.location.href = data.redirectUrl || '/index.html';
                        }, 400);
                    } else {
                        showToast(data.message || 'Invalid username or password.', 'error');
                        submitBtn.disabled = false;
                        submitBtn.innerHTML = '<span>🔐</span> Sign In';
                    }
                } catch (err) {
                    showToast('Connection error. Please try again.', 'error');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<span>🔐</span> Sign In';
                }
            });
        });
    </script>
</body>
</html>
