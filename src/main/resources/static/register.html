<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Registration | CineBook Cinemas</title>
    <link rel="stylesheet" href="css/styles.css?v=2.5">
</head>

<body class="auth-page-body">
    <!-- Shared Cinematic Ambient Background -->
    <div class="cinematic-ambient-bg" aria-hidden="true">
        <div class="ambient-aurora-layer"></div>
        <div class="ambient-light-rays"></div>
        <div class="ambient-orb orb-primary"></div>
        <div class="ambient-orb orb-secondary"></div>
        <div class="ambient-orb orb-accent"></div>
        <canvas id="ambientParticlesCanvas" class="ambient-particles-canvas"></canvas>
    </div>

    <!-- Centered Glass Registration Card with Ambient Halo Ring -->
    <main class="auth-center-wrapper">
        <div class="auth-card-halo" aria-hidden="true"></div>
        <div class="auth-glass-card">
            <!-- Brand Mark -->
            <div class="auth-brand-dock">
                <div class="nav-symbol-prism"
                    style="width:52px; height:52px; background:linear-gradient(135deg, rgba(167, 139, 250, 0.4), rgba(197, 164, 109, 0.35)); border:1.5px solid rgba(255, 255, 255, 0.3); box-shadow:0 0 20px rgba(167, 139, 250, 0.35);">
                    <span class="symbol-core" style="font-size:1.35rem; font-weight:800; color:#FFFFFF;">CB</span>
                </div>
                <h1 class="brand-title" style="font-size:2rem; margin-top:0.75rem; letter-spacing:1px; color:#FFFFFF;">
                    CINE<span style="color:#C5A46D;">BOOK</span></h1>
                <p class="brand-sub"
                    style="font-size:0.78rem; letter-spacing:2.5px; color:#C5A46D; font-weight:700; margin-top:0.25rem;">
                    LUXURY CINEMA ACCOUNT</p>
            </div>

            <div class="auth-header-text">
                <h2>Create Your Account</h2>
                <p>Register for seamless cinema ticket booking, seat reservations, and refund management.</p>
            </div>

            <!-- Registration Form (POSTs to /api/auth/register) -->
            <form id="registerForm" class="auth-form-group">
                <div class="glass-field-group">
                    <label for="fullName">Full Name *</label>
                    <input type="text" id="fullName" required placeholder="e.g. Rahul Sharma" autocomplete="name"
                        autofocus>
                </div>

                <div class="glass-field-group" style="margin-top:1.1rem;">
                    <label for="phone">Mobile Phone (7-15 digits) *</label>
                    <input type="tel" id="phone" required placeholder="e.g. 9876543210" pattern="[0-9]{7,15}"
                        autocomplete="tel">
                </div>

                <div class="glass-field-group" style="margin-top:1.1rem;">
                    <label for="password">Password (minimum 6 characters) *</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="password" required minlength="6" placeholder="••••••••"
                            autocomplete="new-password">
                        <button type="button" class="btn-toggle-password" id="toggleRegPasswordBtn"
                            aria-label="Toggle password visibility" title="Show/Hide Password">
                            <span id="toggleRegPasswordIcon">👁️</span>
                        </button>
                    </div>
                </div>

                <button type="submit" id="btnRegisterSubmit" class="btn-auth-submit">
                    <span>✨</span> Create Account &amp; Continue
                </button>
            </form>

            <div class="auth-switch-dock">
                <span>Already have an account?</span>
                <a href="login.html" class="auth-link-highlight">Sign in here &rarr;</a>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="js/app.js?v=2.5"></script>
    <script src="js/app.js?v=2.6"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('registerForm');
            const submitBtn = document.getElementById('btnRegisterSubmit');
            const passwordInput = document.getElementById('password');
            const toggleBtn = document.getElementById('toggleRegPasswordBtn');
            const toggleIcon = document.getElementById('toggleRegPasswordIcon');

            // Password visibility toggle
            if (toggleBtn && passwordInput) {
                toggleBtn.addEventListener('click', () => {
                    const isPassword = passwordInput.type === 'password';
                    passwordInput.type = isPassword ? 'text' : 'password';
                    toggleIcon.textContent = isPassword ? '🙈' : '👁️';
                    toggleBtn.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
                });
            }

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<span>⏳</span> Registering account...';

                const fullName = document.getElementById('fullName').value.trim();
                const phone = document.getElementById('phone').value.trim();
                const password = passwordInput.value;

                if (!/^[0-9]{7,15}$/.test(phone)) {
                    showToast('Please enter a valid phone number (7-15 digits).', 'error');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<span>✨</span> Create Account &amp; Continue';
                    return;
                }

                try {
                    const resp = await fetch('/api/auth/register', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            username: phone,
                            phone: phone,
                            fullName: fullName,
                            password: password
                        })
                    });

                    const data = await resp.json();
                    if (resp.ok && data.success) {
                        showToast('Account registered successfully! Redirecting to login...', 'success');
                        setTimeout(() => {
                            window.location.href = data.redirectUrl || '/login.html';
                        }, 800);
                    } else {
                        showToast(data.message || 'Registration failed. Please try again.', 'error');
                        submitBtn.disabled = false;
                        submitBtn.innerHTML = '<span>✨</span> Create Account &amp; Continue';
                    }
                } catch (err) {
                    showToast('Connection error. Please try again.', 'error');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<span>✨</span> Create Account &amp; Continue';
                }
            });
        });
    </script>
</body>

</html>
